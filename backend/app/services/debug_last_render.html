        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Telugu:wght@400;600;700;800&family=Noto+Serif+Telugu:wght@400;600;700;800&display=swap');
        
        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased !important;
            -moz-osx-font-smoothing: grayscale !important;
            text-rendering: optimizeLegibility !important;
        }
        body {
            margin: 0;
            padding: 0;
            background: #F0F2F5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .newspaper-container {
            width: 540px;
            background: #FFFFFF;
            margin: 0 auto;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            font-family: 'Gautami', 'Noto Sans Telugu', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            position: relative;
        }
        .hero-image-wrapper {
            position: relative;
            width: 100%;
            height: auto;
            background: #FFFFFF;
            display: block;
        }
        .hero-img {
            width: 100%;
            height: auto;
            max-height: none;
            max-width: 100%;
            object-fit: contain;
            object-position: center center;
            display: block;
        }
        .image-overlay {
            position: relative;
            width: 100%;
            min-height: 60px;
            background: #111111;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            box-sizing: border-box;
            z-index: 2;
        }
        .reporter-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }
        .reporter-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid #FFFFFF;
            object-fit: cover;
            display: block;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            background: #333333;
            flex-shrink: 0;
        }
        .reporter-avatar-fallback {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1d70b8, #0f3d68);
            color: #FFFFFF;
            font-size: 18px;
            font-weight: 700;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            flex-shrink: 0;
        }
        .reporter-meta {
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            gap: 2px;
        }
        .reporter-name {
            font-size: 15px;
            font-weight: 700;
            color: #FFFFFF;
            font-family: 'Noto Sans Telugu', 'Inter', sans-serif;
            line-height: 1.2;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .reporter-date-time {
            font-size: 11px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.88);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.2;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.2px;
        }
        .channel-logo-badge {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            height: 44px;
            max-width: 160px;
            flex-shrink: 0;
            margin-left: 12px;
        }
        .channel-logo-badge svg {
            height: 42px;
            width: 120px;
            max-width: 150px;
            display: block;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.7));
        }
        .channel-logo-badge img {
            max-height: 42px;
            max-width: 150px;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            border-radius: 3px;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.7));
        }
        .channel-logo-badge .overlay-logo-text {
            font-size: 14px;
            font-weight: 800;
            color: #FFFFFF;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 5px 10px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 5px;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            white-space: nowrap;
        }
        .article-content {
            padding: 18px 16px 22px 16px;
            background: #FFFFFF;
            width: 100%;
            box-sizing: border-box;
        }
        .article-headline {
            font-size: 25px;
            font-weight: 700;
            color: #263238;
            line-height: 1.25;
            margin: 0 0 10px 0;
            letter-spacing: -0.2px;
            font-family: 'Gautami Bold', 'Gautami', 'Noto Sans Telugu', 'Inter', sans-serif;
            text-align: left;
        }
        .article-body {
            font-size: 18px;
            line-height: 1.45;
            color: #37474F;
            font-weight: 400;
            margin: 0;
            font-family: 'Gautami', 'Noto Sans Telugu', 'Inter', sans-serif;
            text-align: justify;
            text-justify: inter-word;
        }
        .article-body p {
            margin: 0 0 8px 0;
            word-break: break-word;
            text-align: justify;
            text-justify: inter-word;
        }
        .article-body p:last-child {
            margin-bottom: 0;
        }
        .footer-banner {
            width: 100%;
            background: #111111;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
            gap: 8px;
        }
        .footer-banner-text {
            color: #FFFFFF;
            font-size: 11.5px;
            font-weight: 600;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            letter-spacing: 0.2px;
            line-height: 1.2;
            white-space: nowrap;
        }
        .footer-reporters-text {
            color: #E2E8F0;
            font-size: 10px;
            font-weight: 700;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            letter-spacing: 0.3px;
            white-space: nowrap;
            flex-shrink: 0;
            text-transform: uppercase;
        }

    <script>
        // Signal layout readiness ONLY when DOM and all images are fully loaded & decoded
        function signalWhenReady() {
            const images = Array.from(document.querySelectorAll('img'));
            if (images.length === 0) {
                window.__LAYOUT_DONE__ = true;
                return;
            }
            let loadedCount = 0;
            const total = images.length;
            const markReady = () => {
                window.__LAYOUT_DONE__ = true;
            };
            const onImgFinish = () => {
                loadedCount++;
                if (loadedCount >= total) {
                    markReady();
                }
            };
            images.forEach(img => {
                if (img.complete && img.naturalWidth > 0) {
                    onImgFinish();
                } else {
                    img.addEventListener('load', onImgFinish, { once: true });
                    img.addEventListener('error', onImgFinish, { once: true });
                }
            });
            // 7s fallback in case an external image times out
            setTimeout(markReady, 7000);
        }

        if (document.readyState === 'complete') {
            signalWhenReady();
        } else {
            window.addEventListener('load', signalWhenReady);
        }
    </script>
