services:
  - type: web
    name: newsflow-backend
    runtime: python
    region: singapore        # Change to: oregon, frankfurt, ohio, virginia as needed
    plan: free               # Change to 'starter' ($7/mo) for always-on + more RAM

    buildCommand: ./render-build.sh
    startCommand: cd Spotnewsv2/backend/spotnews_django && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT

    healthCheckPath: /api/v1/admin/auth-users

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
