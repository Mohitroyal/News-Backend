{% extends 'base.html' %}
{% block content %}
<h2>Profile</h2>
<p><strong>Name:</strong> {{ user.name|default:"Not set" }}</p>
<p><strong>Mobile:</strong> {{ user.mobile }}</p>
<p><strong>Email:</strong> {{ user.email|default:"Not set" }}</p>
<p><strong>Role:</strong> {{ user.get_role_display }}</p>
<a href="/dashboard/">Back to Dashboard</a>
{% endblock %}
