{% extends 'base.html' %}
{% block content %}
<h2 style="text-align: center; color: #333; margin-top: 0;">VERIFICATION</h2>
<p style="text-align: center; color: #666; font-size: 14px;">Enter the 6-digit code sent to<br><b>+91 ******{{ mobile|slice:"-4:" }}</b></p>
<div id="error-msg" class="error"></div>
<div class="form-group">
    <input type="text" id="otp" placeholder="• • • • • •" maxlength="6" style="text-align: center; letter-spacing: 8px; font-size: 24px;">
</div>
<button id="verify-btn" onclick="verifyOTP()">Verify &amp; Login</button>
<p style="text-align: center; margin-top: 20px;">
    <span id="countdown" style="color: #666; font-size: 14px;">Resend OTP in <span id="timer">60</span>s</span>
    <a href="#" id="resend-link" style="display:none; color: #0b1c3d; font-weight: bold; text-decoration: none;" onclick="resendOTP()">RESEND OTP</a>
</p>
<p style="text-align: center; font-size: 13px;">
    Wrong phone number? <a href="/auth/login/" style="color: #cc2222; text-decoration: none;">Change it</a>
</p>

<script>
const mobile = new URLSearchParams(window.location.search).get('mobile');
let timeLeft = 60;
const timerInterval = setInterval(() => {
    timeLeft--;
    document.getElementById('timer').innerText = timeLeft;
    if(timeLeft <= 0) {
        clearInterval(timerInterval);
        document.getElementById('countdown').style.display = 'none';
        document.getElementById('resend-link').style.display = 'inline';
    }
}, 1000);

async function verifyOTP() {
    const otp = document.getElementById('otp').value;
    const err = document.getElementById('error-msg');
    if(otp.length !== 6) {
        err.innerText = "Enter 6 digit OTP";
        err.style.display = 'block';
        return;
    }
    
    try {
        const res = await fetch('/api/auth/verify-otp', {
            method: 'POST',
            body: JSON.stringify({mobile: mobile, otp: otp})
        });
        const data = await res.json();
        if(data.success) {
            window.location.href = data.redirect || '/dashboard/';
        } else {
            err.innerText = data.message;
            err.style.display = 'block';
        }
    } catch(e) {
        err.innerText = "Error verifying OTP";
        err.style.display = 'block';
    }
}
async function resendOTP() {
    await fetch('/api/auth/resend-otp', {
        method: 'POST',
        body: JSON.stringify({mobile: mobile})
    });
    window.location.reload();
}
</script>
{% endblock %}
